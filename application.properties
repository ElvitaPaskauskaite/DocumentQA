# DocumentQA settings
documents.folder=documents
ollama.embedding.model=nomic-embed-text
ollama.chat.model=llama3.2
search.top-k=3
search.min-score=0.5
embeddings.cache-file=cache/embeddings.json
chunk.max-words=120
chunk.overlap-words=20
# Where chunk vectors are stored and searched: memory (default) or hana (SAP HANA Cloud,
# needs the HANA_ENDPOINT, HANA_USER and HANA_PASSWORD environment variables)
vector.store=memory